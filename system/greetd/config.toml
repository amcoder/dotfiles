# greetd(5) -- installed to /etc/greetd/config.toml by system/install-greetd.
#
# The greeter is gtkgreet hosted in a bare sway. greetd hands the chosen
# command from /etc/greetd/environments to a PAM session as the user.

[terminal]
# greetd.service carries Conflicts=getty@tty7.service, so this VT is greetd's
# alone. tty1-tty6 keep their gettys, and are the way back in if the greeter
# ever fails to start.
vt = 7

[general]
# uwsm sources /etc/profile and ~/.profile itself while preparing the session
# environment (prepare-env.sh, gated on __LOAD_PROFILE__), and ~/.profile
# prepends to PATH unconditionally rather than guarding against re-entry --
# so sourcing it here as well would duplicate every entry it adds. uwsm owns
# it. The session still starts with systemd's default PATH, which greetd
# inherits and passes down: /etc/environment is empty and common-session has
# no pam_env, so nothing else would supply one.
source_profile = false

[default_session]
# A bare sway whose only job is to host gtkgreet and exit when it does.
#
# SWAY_UNSUPPORTED_GPU stops sway popping a swaynag over gtkgreet on a machine
# with the proprietary nvidia modules loaded; the session's own copy lives in
# ~/.config/uwsm/env, which nothing on this path reads. greetd runs this line
# through sh(1) (greetd(5): "The command-line is run by sh"), so a VAR=value
# prefix would work -- `env` is used instead because it also survives a greetd
# that shlex-splits and execs the argv directly, which is what older versions
# did with source_profile = false.
command = "env SWAY_UNSUPPORTED_GPU=true sway --config /etc/greetd/sway-config"
user = "_greetd"
