# Status line layout. Colours live in ~/.config/tmux/theme.tmux, generated by
# `theme` from the selected palette -- this file only references @thm_*, so it
# must be sourced after it.
#
# Reproduces catppuccin/tmux's rounded window style: window number on the
# right, icon flags, and the application and session status modules.
#
# `-F` resolves #{@thm_*} when this file is sourced; a doubled ## keeps a
# format for render time. The session colour has to stay a render-time
# reference because tmux cannot parse a raw #rrggbb inside #{?...}.

# status bar
set -gF status-style "bg=#{@thm_mantle},fg=#{@thm_text}"
set -g status-left ""
set -gF status-right "#[fg=#{@thm_maroon}]#[fg=#{@thm_crust},bg=#{@thm_maroon}] #[fg=#{@thm_text},bg=#{@thm_surface0}] ##{pane_current_command}#[fg=#{@thm_surface0}] "
set -agF status-right "#[fg=##{?client_prefix,##{E:@thm_red},##{E:@thm_green}}]#[fg=#{@thm_crust},bg=##{?client_prefix,##{E:@thm_red},##{E:@thm_green}}] #[fg=#{@thm_text},bg=#{@thm_surface0}] ##S#[fg=#{@thm_surface0}] "

# messages
# bg=default, not overlay0: catppuccin/tmux means to use overlay0 but its
# %hidden variable resolves empty on tmux 3.7, so this is what it actually drew.
set -gF message-style "fg=#{@thm_teal},bg=default,align=centre"
set -gF message-command-style "fg=#{@thm_teal},bg=default,align=centre"

# panes
set -gF pane-border-style "fg=#{@thm_overlay0}"
set -gF pane-active-border-style "##{?pane_in_mode,fg=##{E:@thm_lavender},##{?pane_synchronized,fg=##{E:@thm_mauve},fg=##{E:@thm_lavender}}}"

# modes
set -gF mode-style "bg=#{@thm_surface0},bold"
set -gF clock-mode-colour "#{@thm_blue}"

%if "#{>=:#{version},3.4}"
  set -gF menu-selected-style "fg=#{@thm_text},bold,bg=#{@thm_overlay0}"
  set -gF popup-style "bg=#{@thm_base},fg=#{@thm_text}"
  set -gF popup-border-style "fg=#{@thm_surface1}"
%endif

# windows
set -gF window-status-activity-style "bg=#{@thm_lavender},fg=#{@thm_crust}"
set -gF window-status-bell-style "bg=#{@thm_yellow},fg=#{@thm_crust}"
set -gF window-status-format "#[fg=#{@thm_text},bg=#{@thm_surface0}]#[fg=#{@thm_mantle},reverse]#[none]#[fg=#{@thm_text},bg=#{@thm_surface0}]##W##{?window_activity_flag, 󱅫,}##{?window_bell_flag, 󰂞,}##{?window_silence_flag, 󰂛,}##{?window_active, 󰖯,}##{?window_last_flag, 󰖰,}##{?window_marked_flag, 󰃀,}##{?window_zoomed_flag, 󰁌,}  #[fg=#{@thm_crust},bg=#{@thm_overlay2}] ##I#[fg=#{@thm_mantle},reverse]#[none]"
set -gF window-status-current-format "#[fg=#{@thm_text},bg=#{@thm_surface1}]#[fg=#{@thm_mantle},reverse]#[none]#[fg=#{@thm_text},bg=#{@thm_surface1}]##W##{?window_activity_flag, 󱅫,}##{?window_bell_flag, 󰂞,}##{?window_silence_flag, 󰂛,}##{?window_active, 󰖯,}##{?window_last_flag, 󰖰,}##{?window_marked_flag, 󰃀,}##{?window_zoomed_flag, 󰁌,}  #[fg=#{@thm_crust},bg=#{@thm_mauve}] ##I#[fg=#{@thm_mantle},reverse]#[none]"
