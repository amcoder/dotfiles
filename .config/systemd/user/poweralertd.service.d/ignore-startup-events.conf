# poweralertd sends a state-update notification the instant it starts and exits
# 1 if the call fails, so under uwsm it could not come up at all: it and
# quickshell both hang off graphical-session.target and race from the same
# starting line, and the notification daemon is quickshell. The sway-run
# launcher this replaced started the session target itself, once it was already
# up, so the race never appeared there.
#
# -s ("ignore the events at startup") removes the race at its source rather
# than working around it -- there is no startup notification to fail, so the
# daemon need not exist yet. Measured with quickshell stopped: bare poweralertd
# exits 1 immediately with "could not send state update notification", and
# poweralertd -s runs indefinitely. Later events still notify, by which time
# quickshell is long up. The only thing given up is the battery-state popup at
# login, which is noise on every login anyway.
#
# Three workarounds were tried before reading poweralertd -h. Each looks right,
# each is worse than the last, and none is needed:
#
# 1. After=quickshell.service DEADLOCKS AT PARSE TIME. This unit carries
#    Requires=graphical-session.target and quickshell is ordered After= that
#    same target, so the edge closes a cycle. systemd breaks a cycle by
#    deleting a job and picked this unit's own start, so it never ran, never
#    failed, and never showed in --state=failed.
#
# 2. A retry budget alone DOES NOT WORK AT ANY SIZE. RestartSec is not honoured
#    while the session is coming up -- systemd logs "Scheduled restart job
#    immediately on client request" and restarts with no delay -- so 20
#    attempts burned in 0.35s against a quickshell that started 0.9s later.
#    It passes a hand-started test, where RestartSec does apply.
#
# 3. `gdbus wait` as an ExecStartPre DEADLOCKS THE WHOLE SESSION. ExecStartPre
#    blocks the start *job*; graphical-session.target is ordered after this
#    unit and quickshell after that target, so it waited 30s for a quickshell
#    that could not start until it finished, timed out, restarted, and waited
#    again -- ten minutes with no bar and no wallpaper. If this ever recurs,
#    `systemctl --user stop poweralertd.service` releases the target at once.
[Service]
ExecStart=
ExecStart=/usr/bin/poweralertd -s
