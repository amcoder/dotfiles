# poweralertd sends a notification the instant it starts and exits 1 if the
# call fails, so it cannot come up before something owns
# org.freedesktop.Notifications. Under uwsm it and quickshell both hang off
# graphical-session.target and race from the same starting line; the sway-run
# launcher this replaced started the session target itself, once it was already
# up, so the race never appeared.
#
# ExecStartPre blocks until the name is actually claimed, which is the only
# thing that is true at the right moment -- a unit having started is not the
# instant its bus name appears. gdbus returns immediately (7ms measured) when
# the name is already owned, so this costs nothing in the normal case, and
# exits non-zero after --timeout so a quickshell that never comes up fails the
# unit once rather than leaving it retrying forever. gdbus is libglib2.0-bin,
# which install already pulls in for `theme`.
#
# Two routes were tried first and both failed, for reasons worth keeping:
#
# After=quickshell.service DEADLOCKS. poweralertd carries
# Requires=graphical-session.target and quickshell is ordered After= that same
# target, so the edge closes a cycle; systemd breaks a cycle by deleting a job,
# and it picked poweralertd's own start. The unit then never ran, never failed,
# and never appeared in --state=failed.
#
# A retry budget alone DOES NOT WORK, however large. RestartSec is not honoured
# while the session is coming up: systemd logs "Scheduled restart job
# immediately on client request" and restarts with no delay at all, so 20
# attempts burned in 0.35s against a quickshell that started 0.9s later. That
# is invisible from a hand-started unit, where RestartSec applies normally and
# the same config looks like it works.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=20

[Service]
ExecStartPre=/usr/bin/gdbus wait --session --timeout 30 org.freedesktop.Notifications
RestartSec=2
