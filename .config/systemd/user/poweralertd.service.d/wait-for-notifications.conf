# poweralertd sends a notification as soon as it starts and exits 1 if that
# call fails, so it cannot come up before something owns
# org.freedesktop.Notifications. Under uwsm graphical-session.target is a real
# ordering barrier that both it and quickshell hang off, so the two race from
# the same starting line -- measured at login: poweralertd started at
# 22:13:09.009, failed three times in 0.67s, and hit the stock StartLimitBurst
# of 5-in-10s at 22:13:09.676; quickshell only started at 22:13:11.182. Under
# the sway-run launcher this replaced, sway started the session target itself
# once it was already up, and the race never appeared.
#
# The retry budget is the whole fix, and it must be the whole fix: 20 attempts
# 2s apart is ~40s of trying, well past quickshell's ~2s, while still giving up
# rather than spinning forever if poweralertd is really broken.
#
# After=quickshell.service must NOT be added, and this is the trap. It reads as
# the obvious belt-and-braces, it would not have helped anyway -- a unit having
# started is not the instant its D-Bus name is claimed -- and it deadlocks the
# pair: poweralertd Requires=graphical-session.target, quickshell is ordered
# After= that same target, so the edge closes a cycle. systemd breaks a cycle by
# deleting a job, and the job it picked was poweralertd's own start:
#
#   graphical-session.target: Found ordering cycle: poweralertd.service/start
#     after quickshell.service/start after graphical-session.target/verify-active
#     - after poweralertd.service
#   Job poweralertd.service/start deleted to break ordering cycle
#
# So the unit never ran, never failed, and never appeared in --state=failed.
# That is strictly worse than the race it was meant to fix: a missing battery
# alert with no symptom anywhere.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=20

[Service]
RestartSec=2
