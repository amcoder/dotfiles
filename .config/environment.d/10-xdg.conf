# The systemd user manager never sources ~/.profile, so the XDG base directories
# and ~/.local/bin have to be declared here or every user unit -- quickshell and
# anything it shells out to, `theme` above all -- comes up without them.
XDG_CONFIG_HOME=${HOME}/.config
XDG_DATA_HOME=${HOME}/.local/share
XDG_STATE_HOME=${HOME}/.local/state
XDG_CACHE_HOME=${HOME}/.cache
XDG_BIN_HOME=${HOME}/.local/bin
PATH=${HOME}/.local/bin:${PATH}
