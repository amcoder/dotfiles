# Qt apps take their palette, widget style, icon theme and fonts from kdeglobals
# only via plasma-integration's platform theme, which loads solely when this is
# set. It lives here rather than in sway/profile because nothing sources that
# file: sway is started as a user unit (wayland-wm@sway.service under uwsm), so
# environment.d is the only place that reaches both the units and everything
# sway execs -- Dolphin above all, which otherwise renders fully light.
QT_QPA_PLATFORMTHEME=kde
